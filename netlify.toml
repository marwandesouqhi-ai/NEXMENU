[build]
publish = "dist"

[functions]
directory = "api"

[[redirects]]
from = "/sitemap.xml"
to = "/.netlify/functions/sitemap"
status = 200

[[redirects]]
from = "/r/:slug"
to = "/.netlify/functions/menu-meta?slug=:slug"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
